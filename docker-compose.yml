services:
  mongo:
    image: mongo:7
    container_name: magic-wand-mongo
    command: ["mongod", "--quiet"]
    ports:
      - 27018:27017
    volumes:
      - mongo_data:/data/db
    networks:
      - magic-wand-network

  backend-dev:
    build:
      context: ./backend
      target: development
    container_name: magic-wand-backend-dev
    ports:
      - 3000:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file: ./backend/.env
    depends_on:
      - mongo
    networks:
      - magic-wand-network

  frontend-dev:
    build:
      context: ./frontend
      target: development
    container_name: magic-wand-frontend-dev
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-dev
    networks:
      - magic-wand-network

volumes:
  mongo_data:

networks:
  magic-wand-network:
    driver: bridge
